name: build and quality

on: [push]

jobs:
    quality-check:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Check quality
              run: |
                  npm i
                  bash .github/workflows/scripts/quality.sh
